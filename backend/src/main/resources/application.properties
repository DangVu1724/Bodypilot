server.port=${PORT:8080}
spring.application.name=backend

application.security.jwt.secret-key=${JWT_SECRET_KEY}
application.security.jwt.expiration=${JWT_EXPIRATION:2592000000}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update

# Gemini Config
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=${GEMINI_API_URL:https://generativelanguage.googleapis.com/v1beta/models/}
gemini.model=${GEMINI_MODEL:gemini-3.5-flash-lite}
gemini.embedding.model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-2}

# Google Auth Client ID (Web Client ID from google-services.json)
google.client.id=${GOOGLE_CLIENT_ID:517107633218-u5u15mb0iuc8j6po8s6mblrc37c6vvd2.apps.googleusercontent.com}

# Firebase Configuration
firebase.config-path=${FIREBASE_CONFIG_PATH:file:secrets/firebase-service-account.json}
